[Service]
RuntimeDirectory=%N
RuntimeDirectoryMode=0700
ExecSearchPath=/usr/bin:/bin
# Quadlet's generated name-based cleanup could remove a preexisting container
# after a refused collision. Only this invocation's successfully created ID is ours.
ExecStop=
ExecStop=-podman stop --ignore --time 1900 --cidfile=%t/%N/${INVOCATION_ID}.cid
ExecStopPost=
ExecStopPost=-podman rm --ignore --force --cidfile=%t/%N/${INVOCATION_ID}.cid
