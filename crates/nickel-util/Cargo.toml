[package]
license = "Apache-2.0"
name = "nickel-util"
version = "0.1.0"
edition = "2021"
description = "Shared primitives for bounded files, JSON, processes and confined Nickel evaluation"
repository = "https://github.com/f1b0-gh/nickeling"
readme = "README.md"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
libc = "0.2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
