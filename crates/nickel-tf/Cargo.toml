[package]
license = "Apache-2.0"
name = "nickel-tf"
version = "0.1.0"
edition = "2021"
description = "Compile Nickel configurations into OpenTofu JSON using frozen provider schemas"
repository = "https://github.com/f1b0-gh/nickeling"
readme = "README.md"

[dependencies]
nickel-util = { path = "../nickel-util", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "nickel-tf"
path = "src/main.rs"
required-features = ["cli"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
